- name: Locate Android project
  id: project
  shell: bash
  run: |
    set -euo pipefail

    PROJECT_DIR="$(find . -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"

    if [ -z "${PROJECT_DIR}" ]; then
      echo "Could not find settings.gradle.kts"
      find . -maxdepth 4 -type f | sort | head -200
      exit 1
    fi

    test -f "${PROJECT_DIR}/app/build.gradle.kts"
    test -f "${PROJECT_DIR}/app/src/main/AndroidManifest.xml"

    echo "project_dir=${PROJECT_DIR}" >> "$GITHUB_OUTPUT"
    echo "Android project found at: ${PROJECT_DIR}"

- name: Build debug APK
  working-directory: ${{ steps.project.outputs.project_dir }}
  run: gradle :app:assembleDebug --stacktrace
